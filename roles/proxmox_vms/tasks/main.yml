---
# Boot order disk first, then CD: the empty disk falls through to the agent
# ISO on first boot; once RHCOS is written to disk the VM boots from disk on
# every later reboot, so the ISO never has to be ejected mid-install.
# cpu: host is required - RHCOS 10 needs x86-64-v3 (AVX2), which the default
# kvm64/x86-64-v2-AES CPU types do not expose.
#
# install_method ipi: the VMs are created empty and stay off. The installer
# powers them on through the Redfish BMC, which puts its own boot ISO in the
# (empty) CD drive.
#
# Every VM talks to the API of its own Proxmox cluster (item.pve_cluster).

- name: Create OpenShift VMs
  community.proxmox.proxmox_kvm:
    api_host: "{{ pve_auth[item.pve_cluster].api_host }}"
    api_port: "{{ pve_auth[item.pve_cluster].api_port }}"
    api_user: "{{ pve_auth[item.pve_cluster].api_user }}"
    api_token_id: "{{ pve_auth[item.pve_cluster].api_token_id }}"
    api_token_secret: "{{ pve_auth[item.pve_cluster].api_token_secret }}"
    validate_certs: "{{ pve_auth[item.pve_cluster].validate_certs }}"
    node: "{{ item.pve_node }}"
    vmid: "{{ item.vmid }}"
    name: "{{ item.name }}.{{ cluster_name }}"
    tags: ["openshift", "{{ cluster_name }}", "{{ item.role }}"]
    ostype: l26
    bios: ovmf
    machine: q35
    efidisk0:
      storage: "{{ item.storage }}"
      format: raw
      efitype: 4m
      pre_enrolled_keys: false
    cpu: host
    sockets: 1
    cores: "{{ item.cores }}"
    memory: "{{ item.memory }}"
    balloon: 0
    numa_enabled: true
    scsihw: virtio-scsi-single
    scsi:
      scsi0: "{{ item.storage }}:{{ item.disk_gb }},iothread=1,ssd=1,discard=on"
    ide:
      ide2: "{{ 'none' if ocp_install_method == 'ipi' else pve_iso_targets[item.pve_cluster].storage ~ ':iso/' ~ agent_iso_name }},media=cdrom"
    net:
      net0: "virtio={{ item.mac }},bridge={{ item.bridge }}{{ (',tag=' ~ item.vlan) if item.vlan | string | length > 0 else '' }}"
    boot: "order=scsi0;ide2"
    onboot: true
    state: present
  loop: "{{ ocp_nodes }}"
  loop_control:
    label: "{{ item.name }} ({{ item.vmid }} on {{ item.pve_cluster }}/{{ item.pve_node }})"

- name: Start masters first (rendezvous host = {{ rendezvous_ip }})
  community.proxmox.proxmox_kvm:
    api_host: "{{ pve_auth[item.pve_cluster].api_host }}"
    api_port: "{{ pve_auth[item.pve_cluster].api_port }}"
    api_user: "{{ pve_auth[item.pve_cluster].api_user }}"
    api_token_id: "{{ pve_auth[item.pve_cluster].api_token_id }}"
    api_token_secret: "{{ pve_auth[item.pve_cluster].api_token_secret }}"
    validate_certs: "{{ pve_auth[item.pve_cluster].validate_certs }}"
    node: "{{ item.pve_node }}"
    vmid: "{{ item.vmid }}"
    state: started
  loop: "{{ ocp_masters + ocp_workers }}"
  loop_control:
    label: "{{ item.name }}"
  when: ocp_install_method != 'ipi'
