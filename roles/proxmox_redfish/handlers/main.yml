---
- name: Restart proxmox-redfish
  ansible.builtin.systemd_service:
    name: proxmox-redfish
    state: restarted
    daemon_reload: true

- name: Restart proxmox-redfish-dhcp
  ansible.builtin.systemd_service:
    name: proxmox-redfish-dhcp
    state: restarted
    daemon_reload: true

- name: Restart proxmox-redfish-console
  ansible.builtin.systemd_service:
    name: proxmox-redfish-console
    state: restarted
    daemon_reload: true
