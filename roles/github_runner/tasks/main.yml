---
- name: Install base packages (Debian/Ubuntu)
  ansible.builtin.apt:
    name: [git, curl, tar, jq, unzip, python3, python3-venv, python3-pip, bind9-dnsutils]
    update_cache: true
  when: ansible_os_family == "Debian"

# Debian has no nmstate package; use the upstream nmstatectl binary instead
- name: Check for nmstatectl
  ansible.builtin.command: nmstatectl --version
  register: github_runner_nmstate
  changed_when: false
  failed_when: false
  when: ansible_os_family == "Debian"

- name: Install nmstatectl from GitHub (Debian)
  when:
    - ansible_os_family == "Debian"
    - github_runner_nmstate.rc != 0
  block:
    - name: Download nmstatectl
      ansible.builtin.get_url:
        url: "https://github.com/nmstate/nmstate/releases/download/v{{ github_runner_nmstate_version }}/nmstatectl-linux-x64.zip"
        dest: /tmp/nmstatectl.zip
        checksum: "sha256:{{ github_runner_nmstate_sha256 }}"
        mode: "0644"

    - name: Unpack nmstatectl to /usr/local/bin
      ansible.builtin.unarchive:
        src: /tmp/nmstatectl.zip
        dest: /usr/local/bin
        remote_src: true
        mode: "0755"

- name: Install base packages (RHEL/Fedora)
  ansible.builtin.dnf:
    name: [git, curl, tar, jq, python3, python3-pip, nmstate, bind-utils]
  when: ansible_os_family == "RedHat"

- name: Create runner user
  ansible.builtin.user:
    name: "{{ github_runner_user }}"
    system: true
    shell: /bin/bash
    create_home: true

- name: Create runner and state dirs
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ github_runner_user }}"
    group: "{{ github_runner_user }}"
    mode: "0750"
  loop: ["{{ github_runner_dir }}", "{{ ocp_state_dir }}"]

- name: Resolve latest runner version
  when: github_runner_version == "latest"
  ansible.builtin.uri:
    url: https://api.github.com/repos/actions/runner/releases/latest
    return_content: true
  register: github_runner_release

- name: Set runner version
  ansible.builtin.set_fact:
    github_runner_ver: "{{ (github_runner_release.json.tag_name | regex_replace('^v', '')) if github_runner_version == 'latest' else github_runner_version }}"
    github_runner_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'x64' }}"

- name: Download and unpack runner {{ github_runner_ver }}
  ansible.builtin.unarchive:
    src: >-
      https://github.com/actions/runner/releases/download/v{{ github_runner_ver
      }}/actions-runner-linux-{{ github_runner_arch }}-{{ github_runner_ver }}.tar.gz
    dest: "{{ github_runner_dir }}"
    remote_src: true
    owner: "{{ github_runner_user }}"
    group: "{{ github_runner_user }}"
    creates: "{{ github_runner_dir }}/config.sh"

- name: Install runner OS dependencies (libicu etc.)
  ansible.builtin.command: "{{ github_runner_dir }}/bin/installdependencies.sh"
  register: github_runner_deps
  changed_when: "'already installed' not in github_runner_deps.stdout"

- name: Check whether runner is already registered
  ansible.builtin.stat:
    path: "{{ github_runner_dir }}/.runner"
  register: github_runner_registered

- name: Register runner
  when: not github_runner_registered.stat.exists
  block:
    - name: Fetch registration token with GITHUB_PAT
      when: github_runner_token | length == 0
      ansible.builtin.uri:
        url: "https://api.github.com/repos/{{ github_runner_repo }}/actions/runners/registration-token"
        method: POST
        status_code: 201
        headers:
          Authorization: "Bearer {{ github_runner_pat }}"
          Accept: application/vnd.github+json
      register: github_runner_tok
      no_log: true
      delegate_to: localhost
      become: false

    - name: Need a token
      ansible.builtin.assert:
        that: (github_runner_token | length > 0) or (github_runner_tok.json.token is defined)
        fail_msg: "No registration token: paste one at the prompt or export GITHUB_PAT."

    - name: Configure runner
      ansible.builtin.command:
        argv:
          - "{{ github_runner_dir }}/config.sh"
          - --unattended
          - --replace
          - --url
          - "https://github.com/{{ github_runner_repo }}"
          - --token
          - "{{ github_runner_token if github_runner_token | length > 0 else github_runner_tok.json.token }}"
          - --name
          - "{{ github_runner_name }}"
          - --labels
          - "{{ github_runner_labels | join(',') }}"
          - --work
          - _work
        chdir: "{{ github_runner_dir }}"
        creates: "{{ github_runner_dir }}/.runner"
      become: true
      become_user: "{{ github_runner_user }}"
      no_log: true

- name: Install runner as systemd service
  ansible.builtin.command:
    cmd: "./svc.sh install {{ github_runner_user }}"
    chdir: "{{ github_runner_dir }}"
    creates: "{{ github_runner_dir }}/.service"

- name: Start runner service
  ansible.builtin.command:
    cmd: ./svc.sh start
    chdir: "{{ github_runner_dir }}"
  register: github_runner_svc
  changed_when: "'active (running)' not in github_runner_svc.stdout"

- name: Next steps
  ansible.builtin.debug:
    msg:
      - "Runner '{{ github_runner_name }}' is online with labels self-hosted,linux,{{ github_runner_labels | join(',') }}."
      - "It must reach: Proxmox API ({{ proxmox_api_host | default('pve') }}:8006), the node IPs (6443, 8090),"
      - "mirror.openshift.com, quay.io/registry.redhat.io, and resolve api.<cluster>.<domain>."
      - "Then add secrets to the 'proxmox' environment and run the 'Deploy OpenShift on Proxmox' workflow."
