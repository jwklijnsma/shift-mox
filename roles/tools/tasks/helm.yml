---
# helm in the state dir (kubemox, CCM manifests, CSI driver)
- name: Helm directory
  ansible.builtin.file:
    path: "{{ helm_bin | dirname }}"
    state: directory
    mode: "0750"

- name: Download helm {{ helm_version }}
  ansible.builtin.get_url:
    url: "https://get.helm.sh/helm-v{{ helm_version }}-linux-amd64.tar.gz"
    dest: "{{ helm_bin | dirname }}/helm.tar.gz"
    checksum: "sha256:https://get.helm.sh/helm-v{{ helm_version }}-linux-amd64.tar.gz.sha256sum"
    mode: "0640"

- name: Unpack helm
  ansible.builtin.unarchive:
    src: "{{ helm_bin | dirname }}/helm.tar.gz"
    dest: "{{ helm_bin | dirname }}"
    extra_opts: [--strip-components=1, linux-amd64/helm]
    creates: "{{ helm_bin }}"
