---
# Worker autoscaling on Proxmox VE, run after the cluster is installed:
#   ansible-playbook autoscale.yml --ask-vault-pass
#
# 1. proxmox-redfish  Redfish BMC emulator (sushy-tools + Proxmox driver) as a
#                     systemd service on the runner LXC
#                     on_demand: it also creates a worker VM when OpenShift
#                     provisions one and deletes it after scale-down
# 2. ocp_autoscale    BareMetalHosts pointing at the emulator (kubemox mode:
#                     kubemox operator + pre-created VMs),
#                     ClusterAutoscaler + MachineAutoscaler on the worker MachineSet
#
# Afterwards scale from the console (Compute > MachineSets > Edit Machine count)
# or let the ClusterAutoscaler do it when pods are Pending.
# Settings: group_vars/all/autoscale.yml

- name: Cluster token for the Redfish BMC (on-demand VMs)
  hosts: localhost
  gather_facts: false
  tags: [bmc, cluster]
  environment:
    PATH: "{{ ocp_bin_dir }}:{{ lookup('ansible.builtin.env', 'PATH') }}"
    KUBECONFIG: "{{ work_dir }}/kubeconfig"
  tasks:
    - name: Autoscaling needs platform baremetal (Metal3)
      ansible.builtin.assert:
        that: ocp_install_method in ['agent', 'ipi'] and not ocp_is_sno
        fail_msg: >-
          Worker autoscaling uses Metal3 BareMetalHosts, which only exist on platform
          baremetal with 3 masters (install_method agent or ipi). install_method external
          has no Machine API; there the Proxmox CCM removes nodes whose VM is gone.
        quiet: true
      tags: [always]
    - name: Autoscale slots must be on known Proxmox clusters (kubemox only on the main one)
      ansible.builtin.assert:
        that:
          - _clusters | reject('in', pve_clusters.keys() | list) | list | length == 0
          - autoscale_vm_provisioning == 'on_demand' or _clusters | reject('equalto', proxmox_main_cluster) | list | length == 0
        fail_msg: >-
          autoscale_proxmox_nodes places slots on {{ _clusters | join(', ') }}; known clusters:
          {{ pve_clusters.keys() | join(', ') }}. kubemox (autoscale_vm_provisioning: kubemox) only
          works with the main Proxmox cluster - use on_demand for other clusters.
        quiet: true
      vars:
        _clusters: "{{ autoscale_pool | map(attribute='pve_cluster') | unique | list }}"
      tags: [always]
    - name: Tools (oc)
      ansible.builtin.include_role:
        name: tools
      when: autoscale_vm_provisioning == 'on_demand'
    - name: Read-only token for listing BareMetalHosts
      ansible.builtin.include_role:
        name: ocp_autoscale
        tasks_from: bmc_token.yml
      when: autoscale_vm_provisioning == 'on_demand'

- name: Redfish BMC emulator for Proxmox VMs
  # Override with -e redfish_bmc_hosts=<group or host> (play hosts can't come from group_vars)
  hosts: "{{ redfish_bmc_hosts | default('runner') }}"
  gather_facts: true
  become: true
  tags: [bmc]
  roles:
    - proxmox_redfish

- name: Worker slots, Metal3 hosts and autoscaler
  hosts: localhost
  gather_facts: false
  tags: [cluster]
  environment:
    PATH: "{{ ocp_bin_dir }}:{{ lookup('ansible.builtin.env', 'PATH') }}"
    KUBECONFIG: "{{ work_dir }}/kubeconfig"
  roles:
    - { role: tools, tags: [tools] }
    - ocp_autoscale
