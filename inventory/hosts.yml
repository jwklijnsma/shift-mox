---
# site.yml / destroy.yml run on localhost and only use the Proxmox API.
# runner.yml additionally SSHes to the Proxmox host to create the runner LXC
# and configures it with `pct exec` - the LXC needs no SSH and no open ports.
all:
  hosts:
    localhost:
      ansible_connection: local
      ansible_python_interpreter: "{{ ansible_playbook_python }}"
  children:
    proxmox_host:
      hosts:
        pve01:
          ansible_host: pve01.lab.example.nl   # SSH address of the Proxmox server
          ansible_user: root
    runner:
      hosts:
        gh-runner:
          ansible_connection: community.proxmox.proxmox_pct_remote
          ansible_host: "{{ hostvars['pve01'].ansible_host }}"
          ansible_user: root
          proxmox_vmid: "{{ runner_lxc_vmid }}"
