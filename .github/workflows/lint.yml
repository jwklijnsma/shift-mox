name: Lint

# Runs on GitHub-hosted runners with no secrets, so it is safe for every
# push and pull request. Deploys only ever happen via deploy.yml.
on:
  push:
  pull_request:
  # Called by release.yml, so a release is only tagged on a commit that passes.
  workflow_call:
    inputs:
      ref:
        description: Commit to check
        type: string
        required: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - run: pip install -q ansible-core ansible-lint proxmoxer requests
      - run: ansible-galaxy collection install -r requirements.yml -p ./collections
      - name: Syntax check
        run: |
          for p in site.yml destroy.yml runner.yml autoscale.yml; do
            ansible-playbook "$p" --syntax-check -e proxmox_api_token_secret=dummy -e redfish_bmc_password=dummy
          done
      - name: ansible-lint
        run: ansible-lint --offline site.yml destroy.yml runner.yml autoscale.yml roles/
      - name: Python (Redfish emulator)
        run: |
          pip install -q ruff
          ruff check roles/proxmox_redfish/files/
      - name: shellcheck
        run: shellcheck ocp.sh
