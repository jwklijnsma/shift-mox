# Shiftmox documentation - built with Zensical (https://zensical.org)
#   pip install -r requirements-docs.txt
#   zensical serve            # preview on http://localhost:8000
#   zensical build --strict   # what CI runs

[project]
site_name = "Shiftmox"
site_description = "OpenShift / OKD 5 on Proxmox VE from code - with worker autoscaling from the OpenShift console"
site_url = "https://jwklijnsma.github.io/shift-mox/"
repo_url = "https://github.com/jwklijnsma/shift-mox"
repo_name = "jwklijnsma/shift-mox"
edit_uri = "edit/main/docs/"
copyright = "Shiftmox - lab/test use; Proxmox VE is not a Red Hat certified hypervisor"

nav = [
  { "Home" = "index.md" },
  { "Getting started" = [
    { "Requirements" = "getting-started/requirements.md" },
    { "Quick start (on the Proxmox host)" = "getting-started/quickstart.md" },
  ] },
  { "Configuration" = [
    { "cluster.yml" = "configuration/cluster.md" },
    { "Secrets" = "configuration/secrets.md" },
    { "Environments" = "configuration/environments.md" },
    { "Several Proxmox clusters" = "configuration/multi-proxmox.md" },
  ] },
  { "Install methods" = [
    { "Overview" = "install/methods.md" },
    { "Installer-provisioned (ipi)" = "install/ipi.md" },
    { "Platform External + CCM" = "install/external.md" },
    { "Proxmox CSI driver" = "install/csi.md" },
  ] },
  { "Deploy" = [
    { "ocp.sh" = "deploy/ocp-sh.md" },
    { "Ansible playbooks" = "deploy/ansible.md" },
    { "GitHub Actions" = "deploy/github-actions.md" },
  ] },
  { "Autoscaling" = [
    { "How it works" = "autoscaling/overview.md" },
    { "Set up" = "autoscaling/setup.md" },
    { "Day-2 operations" = "autoscaling/operations.md" },
  ] },
  { "Troubleshooting" = "troubleshooting.md" },
  { "Reference" = [
    { "How it works" = "reference/how-it-works.md" },
    { "Repository layout" = "reference/layout.md" },
    { "Releases and updates" = "reference/releases.md" },
    { "Design: native platform" = "reference/native-platform.md" },
    { "End-to-end tests" = "reference/e2e.md" },
  ] },
]

[project.theme]
language = "en"
features = [
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "navigation.footer",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "search.highlight",
]

[project.theme.icon]
logo = "material/kubernetes"
repo = "fontawesome/brands/github"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "red"
accent = "deep orange"
toggle.icon = "material/weather-night"
toggle.name = "Dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "red"
accent = "deep orange"
toggle.icon = "material/weather-sunny"
toggle.name = "Light mode"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.snippets = {}
pymdownx.tabbed.alternate_style = true
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
