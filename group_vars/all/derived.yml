---
# Computed values - normally no need to edit.
# --- OpenShift vs OKD --------------------------------------------------------
ocp_is_okd: "{{ ocp_distribution | default('ocp') == 'okd' }}"
ocp_release: "{{ okd_version if ocp_is_okd else ocp_version }}"
# OKD release assets carry the version in the file name; the OCP mirror doesn't
ocp_download_base: >-
  {{ ('https://github.com/okd-project/okd/releases/download/' ~ okd_version)
     if ocp_is_okd else ocp_mirror_base }}
ocp_tool_suffix: "{{ ('-' ~ okd_version) if ocp_is_okd else '' }}"
ocp_tool_tarballs:
  - "openshift-install-linux{{ ocp_tool_suffix }}.tar.gz"
  - "openshift-client-linux{{ ocp_tool_suffix }}.tar.gz"
# OKD needs no Red Hat pull secret; this placeholder is what the OKD docs use.
okd_pull_secret: '{"auths":{"fake":{"auth":"aWQ6cGFzcwo="}}}'
# Evaluated lazily, so the pull secret file is only read for OpenShift.
ocp_pull_secret: >-
  {{ okd_pull_secret if ocp_is_okd
     else (lookup('ansible.builtin.file', pull_secret_file) | from_json | to_json) }}

ocp_bin_dir: "{{ ocp_state_dir }}/bin/{{ ocp_release }}"
ocp_install_bin: "{{ ocp_bin_dir }}/openshift-install"
oc_bin: "{{ ocp_bin_dir }}/oc"

# --- Automatic VM list -------------------------------------------------------
ocp_nodes_generated: >-
  {%- set ns = namespace(out=[]) -%}
  {%- set o = ip_start.split('.') | map('int') | list -%}
  {%- set base = o[0] * 16777216 + o[1] * 65536 + o[2] * 256 + o[3] -%}
  {%- set roles = ['master'] * (ocp_master_count | int) + ['worker'] * (ocp_worker_count | int) -%}
  {%- for role in roles -%}
    {%- set i = loop.index0 -%}
    {%- set idx = i if role == 'master' else i - (ocp_master_count | int) -%}
    {%- set n = base + i -%}
    {%- set b = [(n // 16777216) % 256, (n // 65536) % 256, (n // 256) % 256, n % 256] -%}
    {%- set name = role ~ '-' ~ idx -%}
    {%- set size = master_size if role == 'master' else worker_size -%}
    {%- set node = {
          'name': name,
          'role': role,
          'vmid': (vmid_start | int) + i,
          'pve_node': proxmox_nodes[i % (proxmox_nodes | length)],
          'ip': b | join('.'),
          'mac': '52:54:00:%02x:%02x:%02x' | format(b[1], b[2], b[3]),
        } | combine(size) | combine(node_overrides[name] | default({})) -%}
    {%- set ns.out = ns.out + [node] -%}
  {%- endfor -%}
  {{ ns.out }}

# --- Proxmox clusters -----------------------------------------------------------
# The main cluster (proxmox_api_*, proxmox_*_storage, proxmox_bridge) plus the
# independent ones in proxmox_clusters, each with every setting filled in.
pve_clusters: >-
  {%- set main = {
        'api_host': proxmox_api_host, 'api_port': proxmox_api_port | int,
        'api_user': proxmox_api_user, 'api_token_id': proxmox_api_token_id,
        'api_token_secret': proxmox_api_token_secret, 'validate_certs': proxmox_validate_certs | bool,
        'iso_node': proxmox_iso_node, 'iso_storage': proxmox_iso_storage,
        'disk_storage': proxmox_disk_storage, 'bridge': proxmox_bridge,
        'vlan': proxmox_vlan | default('') | string, 'region': proxmox_region } -%}
  {%- set ns = namespace(out={proxmox_main_cluster: main}) -%}
  {%- for name, c in (proxmox_clusters | default({})).items() -%}
    {%- set ns.out = ns.out | combine({name: main | combine({'iso_node': '', 'region': name}) | combine(c)}) -%}
  {%- endfor -%}
  {{ ns.out }}
# Module arguments for community.proxmox per cluster
pve_auth: >-
  {%- set ns = namespace(out={}) -%}
  {%- for name, c in pve_clusters.items() -%}
    {%- set ns.out = ns.out | combine({name: {
          'api_host': c.api_host, 'api_port': c.api_port | int, 'api_user': c.api_user,
          'api_token_id': c.api_token_id, 'api_token_secret': c.api_token_secret,
          'validate_certs': c.validate_certs | bool}}) -%}
  {%- endfor -%}
  {{ ns.out }}

# Node list with the placement resolved: "site2/pve11" -> pve_cluster site2,
# pve_node pve11; a bare node name is on the main cluster. Each node also gets
# its cluster's storage / bridge / VLAN (a node_overrides entry can set them).
ocp_nodes: >-
  {%- set ns = namespace(out=[]) -%}
  {%- for n in (ocp_nodes_manual if (ocp_nodes_manual | length) > 0 else ocp_nodes_generated) -%}
    {%- set place = (n.pve_node | string).split('/', 1) -%}
    {%- set cl = place[0] if place | length == 2 else (n.pve_cluster | default(proxmox_main_cluster)) -%}
    {%- set c = pve_clusters[cl] | default({}) -%}
    {%- set ns.out = ns.out + [{'storage': c.disk_storage | default(proxmox_disk_storage),
                                'bridge': c.bridge | default(proxmox_bridge),
                                'vlan': c.vlan | default('') | string}
                               | combine(n)
                               | combine({'pve_cluster': cl, 'pve_node': place | last})] -%}
  {%- endfor -%}
  {{ ns.out }}
# Nodes of the main cluster named in proxmox_nodes (bare or "main/<node>")
proxmox_main_nodes: >-
  {{ (proxmox_nodes | map('string') | reject('search', '/') | list)
     + (proxmox_nodes | map('string') | select('match', proxmox_main_cluster ~ '/') | map('regex_replace', '^[^/]+/', '') | list) }}
# Proxmox clusters this cluster's VMs use (main first)
pve_clusters_used: "{{ ([proxmox_main_cluster] + (ocp_nodes | map(attribute='pve_cluster') | list)) | unique | list }}"
# Where the agent ISO goes, per used cluster: {cluster: {node, storage}}
pve_iso_targets: >-
  {%- set ns = namespace(out={}) -%}
  {%- for cl in pve_clusters_used -%}
    {%- set vm_nodes = ocp_nodes | selectattr('pve_cluster', 'equalto', cl) | map(attribute='pve_node') | list -%}
    {%- set node = pve_clusters[cl].iso_node if (pve_clusters[cl].iso_node | default('') | length > 0)
                   else (vm_nodes | first | default('')) -%}
    {%- if node | length > 0 -%}
      {%- set ns.out = ns.out | combine({cl: {'node': node, 'storage': pve_clusters[cl].iso_storage}}) -%}
    {%- endif -%}
  {%- endfor -%}
  {{ ns.out }}

ocp_masters: "{{ ocp_nodes | selectattr('role', 'equalto', 'master') | list }}"
ocp_workers: "{{ ocp_nodes | selectattr('role', 'equalto', 'worker') | list }}"
ocp_is_sno: "{{ (ocp_masters | length) == 1 and (ocp_workers | length) == 0 }}"
rendezvous_ip: "{{ ocp_masters[0].ip }}"

# --- Install method ------------------------------------------------------------
ocp_install_method: "{{ install_method | default('agent') }}"
# Where api / api-int and *.apps must point
cluster_api_ip: >-
  {{ rendezvous_ip if ocp_is_sno
     else external_lb_address if ocp_install_method == 'external'
     else api_vip }}
cluster_ingress_ip: >-
  {{ rendezvous_ip if ocp_is_sno
     else external_lb_address if ocp_install_method == 'external'
     else ingress_vip }}
# Redfish BMC URL of a node VM (sushy finds the system by VM name)
redfish_system_url: "redfish-virtualmedia+https://{{ redfish_bmc_address }}:{{ redfish_bmc_port }}/redfish/v1/Systems/"

agent_iso_name: "agent-{{ cluster_name }}-{{ ocp_release }}.{{ ocp_arch }}.iso"

# Used via module_defaults (group/community.proxmox.proxmox) in the playbooks
proxmox_auth:
  api_host: "{{ proxmox_api_host }}"
  api_port: "{{ proxmox_api_port }}"
  api_user: "{{ proxmox_api_user }}"
  api_token_id: "{{ proxmox_api_token_id }}"
  api_token_secret: "{{ proxmox_api_token_secret }}"
  validate_certs: "{{ proxmox_validate_certs }}"

# --- Autoscale spare pool (autoscale.yml) -------------------------------------
# Spare VMs continue the IP/MAC numbering after the last installed node.
autoscale_pool_size: "{{ [(autoscale_max_workers | int) - (ocp_workers | length), 0] | max }}"
autoscale_pool: >-
  {%- set ns = namespace(out=[]) -%}
  {%- set o = ip_start.split('.') | map('int') | list -%}
  {%- set base = o[0] * 16777216 + o[1] * 65536 + o[2] * 256 + o[3] + (ocp_nodes | length) -%}
  {%- for i in range(autoscale_pool_size | int) -%}
    {%- set n = base + i -%}
    {%- set b = [(n // 16777216) % 256, (n // 65536) % 256, (n // 256) % 256, n % 256] -%}
    {%- set place = (autoscale_proxmox_nodes[i % (autoscale_proxmox_nodes | length)] | string).split('/', 1) -%}
    {%- set cl = place[0] if place | length == 2 else proxmox_main_cluster -%}
    {%- set c = pve_clusters[cl] | default({}) -%}
    {%- set ns.out = ns.out + [{
          'name': autoscale_name_prefix ~ '-' ~ i,
          'vm_name': autoscale_name_prefix ~ '-' ~ i ~ '.' ~ cluster_name,
          'pve_cluster': cl,
          'pve_node': place | last,
          'storage': c.disk_storage | default(proxmox_disk_storage),
          'bridge': c.bridge | default(proxmox_bridge),
          'vlan': c.vlan | default('') | string,
          'ip': b | join('.'),
          'mac': '52:54:00:%02x:%02x:%02x' | format(b[1], b[2], b[3]),
        } | combine(autoscale_worker_size)] -%}
  {%- endfor -%}
  {{ ns.out }}
# Only VMs matching this are visible to the Redfish emulator
autoscale_vm_name_regex: '^{{ autoscale_name_prefix }}-[0-9]+\.{{ cluster_name | regex_escape }}$'
# With install_method ipi the emulator also drives the masters and workers.
redfish_vm_name_regex: >-
  {{ ('^(' ~ (ocp_nodes | map(attribute='name') | map('regex_escape') | join('|'))
      ~ '|' ~ autoscale_name_prefix ~ '-[0-9]+)\.' ~ (cluster_name | regex_escape) ~ '$')
     if ocp_install_method == 'ipi' else autoscale_vm_name_regex }}
helm_bin: "{{ ocp_state_dir }}/bin/helm-{{ helm_version }}/helm"
